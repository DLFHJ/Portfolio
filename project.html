<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — David Laßlberger</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @font-face {
            font-family: 'Aspekta';
            src: url('assets/fonts/Aspekta-700.woff2') format('woff2');
            font-weight: 700;
        }

        :root {
            --cursor-size: 12px;
            --cursor-hover-size: 60px;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #fff;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-bold {
            font-family: 'Aspekta', sans-serif;
        }

        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s cubic-bezier(0.5, 0, 0, 1), transform 0.7s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Smart Custom Cursor Logic */
        @media (pointer: fine) {
            #custom-cursor {
                position: fixed;
                top: 0;
                left: 0;
                width: var(--cursor-size);
                height: var(--cursor-size);
                background-color: white;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                transition: width 0.3s cubic-bezier(0.19, 1, 0.22, 1),
                    height 0.3s cubic-bezier(0.19, 1, 0.22, 1);
                mix-blend-mode: difference;
            }

            body.hovering #custom-cursor {
                width: var(--cursor-hover-size);
                height: var(--cursor-hover-size);
                background-color: white;
            }
        }

        @media (pointer: coarse) {
            #custom-cursor {
                display: none;
            }
        }
    </style>
</head>

<body class="text-gray-900 antialiased selection:bg-black selection:text-white">

    <!-- Custom Cursor Element -->
    <div id="custom-cursor"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-white/0 z-40 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 relative z-50">
            <div class="flex justify-between items-center h-24">
                <div class="flex-shrink-0">
                    <a href="index.html"
                        class="hover-target block font-bold text-sm tracking-tight uppercase text-black">David
                        Laßlberger, MA</a>
                </div>
                <div class="flex items-center">
                    <div class="hidden md:flex items-center space-x-8 mr-8">
                        <a href="index.html#work" data-i18n="nav_work"
                            class="hover-target text-xs uppercase tracking-widest hover:text-gray-500 transition-colors py-2">Work</a>
                        <a href="index.html#about" data-i18n="nav_about"
                            class="hover-target text-xs uppercase tracking-widest hover:text-gray-500 transition-colors py-2">About</a>
                        <a href="index.html#contact" data-i18n="nav_contact"
                            class="hover-target text-xs uppercase tracking-widest hover:text-gray-500 transition-colors py-2">Contact</a>
                    </div>
                    <div class="flex items-center space-x-3 md:space-x-8">
                        <button id="langToggle" onclick="toggleLanguage()"
                            class="hover-target flex items-center text-xs uppercase tracking-widest border border-gray-400 px-3 py-1.5 rounded-full lg:hover:bg-black lg:hover:text-white active:scale-95 transition-all duration-300 relative z-50">
                            <span id="langLabel">EN</span>
                        </button>
                        <div class="md:hidden relative z-50">
                            <button class="hover-target p-2 -mr-2" onclick="toggleMobileMenu()">
                                <i id="menuIconOpen" data-lucide="menu" class="w-6 h-6"></i>
                                <i id="menuIconClose" data-lucide="x" class="w-6 h-6 hidden"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobileMenu"
        class="fixed inset-0 bg-white z-[39] flex flex-col justify-center items-center space-y-8 pt-20 transition-opacity duration-300 opacity-0 pointer-events-none md:hidden">
        <a href="index.html#work" data-i18n="nav_work" onclick="toggleMobileMenu()"
            class="hover-target text-3xl font-bold uppercase tracking-widest text-black hover:text-gray-500 transition-colors">Work</a>
        <a href="index.html#about" data-i18n="nav_about" onclick="toggleMobileMenu()"
            class="hover-target text-3xl font-bold uppercase tracking-widest text-black hover:text-gray-500 transition-colors">About</a>
        <a href="index.html#contact" data-i18n="nav_contact" onclick="toggleMobileMenu()"
            class="hover-target text-3xl font-bold uppercase tracking-widest text-black hover:text-gray-500 transition-colors">Contact</a>
    </div>

    <!-- Header (fields populated by JS) -->
    <header class="pt-24">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 pt-8 pb-8">
            <div class="grid grid-cols-12">
                <div class="col-span-12 md:col-span-10">
                    <h1 id="proj-title" class="font-bold leading-none tracking-tighter"
                        style="font-size:clamp(3rem,7vw,6.5rem);opacity:0;transform:translateY(14px)"></h1>
                </div>
            </div>
        </div>

        <div id="hdr-hero" class="max-w-7xl mx-auto px-6 lg:px-8" style="opacity:0;transform:translateY(14px)">
            <img id="proj-hero" src="" alt="" class="w-full object-cover aspect-[16/9]">
        </div>

        <div id="hdr-meta" class="max-w-7xl mx-auto px-6 lg:px-8 mt-0" style="opacity:0;transform:translateY(14px)">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-5 md:gap-y-0 md:divide-x divide-gray-100 py-7">
                <div class="pr-4 pb-4 border-b border-r border-gray-100 md:border-0 md:pr-8 md:pb-1">
                    <p data-i18n="meta_year"
                        class="text-xs uppercase tracking-widest text-gray-400 font-mono mb-1.5">Year</p>
                    <p id="proj-year" class="text-sm text-gray-700"></p>
                </div>
                <div class="pl-4 pb-4 border-b border-gray-100 md:border-0 md:px-8 md:pb-1">
                    <p data-i18n="meta_category"
                        class="text-xs uppercase tracking-widest text-gray-400 font-mono mb-1.5">Category</p>
                    <p id="proj-category" class="text-sm text-gray-700"></p>
                </div>
                <div class="pr-4 border-r border-gray-100 md:border-0 md:px-8">
                    <p data-i18n="meta_role"
                        class="text-xs uppercase tracking-widest text-gray-400 font-mono mb-1.5">Role</p>
                    <p id="proj-role" class="text-sm text-gray-700"></p>
                </div>
                <div class="pl-4 md:px-8">
                    <p data-i18n="meta_tools"
                        class="text-xs uppercase tracking-widest text-gray-400 font-mono mb-1.5">Tools</p>
                    <p id="proj-tools" class="text-sm text-gray-700"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Dynamic content sections -->
    <main id="proj-content" class="pb-28"></main>

    <!-- Prev / Next footer (hidden until project loads) -->
    <section id="proj-nav" class="border-t border-gray-100 hidden">
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2">
                <a id="prev-link" href="#"
                    class="hover-target group min-w-0 hidden md:flex items-center justify-start gap-4 md:gap-6 pl-6 lg:pl-8 pr-6 py-14 md:py-20 border-r border-gray-100 hover:bg-gray-50 transition-colors">
                    <div class="aspect-[4/3] w-24 sm:w-28 md:w-40 flex-shrink-0 overflow-hidden bg-gray-100">
                        <img id="prev-image" src="" alt=""
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <div class="min-w-0">
                        <p data-i18n="nav_prev"
                            class="text-xs text-gray-400 uppercase tracking-widest font-mono mb-3">← Previous</p>
                        <h3 id="prev-title"
                            class="font-bold text-xl md:text-2xl group-hover:text-gray-400 transition-colors truncate"></h3>
                        <p id="prev-category" class="text-xs text-gray-400 mt-1 uppercase tracking-wider"></p>
                    </div>
                </a>
                <a id="next-link" href="#"
                    class="hover-target group min-w-0 flex items-center justify-end gap-4 md:gap-6 pl-6 pr-6 lg:pr-8 py-14 md:py-20 hover:bg-gray-50 transition-colors">
                    <div class="min-w-0 text-right">
                        <p data-i18n="nav_next"
                            class="text-xs text-gray-400 uppercase tracking-widest font-mono mb-3">Next →</p>
                        <h3 id="next-title"
                            class="font-bold text-xl md:text-2xl group-hover:text-gray-400 transition-colors truncate"></h3>
                        <p id="next-category" class="text-xs text-gray-400 mt-1 uppercase tracking-wider"></p>
                    </div>
                    <div class="aspect-[4/3] w-24 sm:w-28 md:w-40 flex-shrink-0 overflow-hidden bg-gray-100">
                        <img id="next-image" src="" alt=""
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                </a>
            </div>
        </div>
    </section>

    <script>
        lucide.createIcons();

        // --- Custom Cursor Config ---
        // Switch this to true to enable the custom dot cursor and its interactions
        const ENABLE_CUSTOM_CURSOR = true;

        // Language persistence
        let currentLang = localStorage.getItem('lang') || 'en';
        let loadedProject = null;
        let loadedPrev = null;
        let loadedNext = null;

        const translations = {
            en: { nav_work: 'Work', nav_about: 'About', nav_contact: 'Contact', meta_year: 'Year', meta_category: 'Category', meta_role: 'Role', meta_tools: 'Tools', nav_prev: '← Previous', nav_next: 'Next →', nav_back: '← Back to Work' },
            de: { nav_work: 'Projekte', nav_about: 'Über mich', nav_contact: 'Kontakt', meta_year: 'Jahr', meta_category: 'Kategorie', meta_role: 'Rolle', meta_tools: 'Tools', nav_prev: '← Vorheriges Projekt', nav_next: 'Nächstes Projekt →', nav_back: '← Zurück zu Projekte' }
        };

        function getLang(field) {
            if (!field) return '';
            if (typeof field === 'string') return field;
            return field[currentLang] || field.en || '';
        }

        // block.shadow: true → default "drop-shadow", or a Tailwind shadow
        // scale value ("sm", "md", "lg", "xl", "2xl") → "drop-shadow-{value}".
        // Uses the drop-shadow filter (not box-shadow) so the shadow hugs the
        // visible image content — box-shadow would instead outline the full
        // aspect-ratio box, including any letterboxed empty space from
        // fit: "contain".
        function shadowClass(block) {
            if (!block.shadow) return '';
            return block.shadow === true ? 'drop-shadow' : `drop-shadow-${block.shadow}`;
        }

        function applyLanguage() {
            const label = document.getElementById('langLabel');
            if (label) label.textContent = currentLang.toUpperCase();
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang]?.[key]) el.textContent = translations[currentLang][key];
            });
            if (loadedProject) {
                document.title = `${getLang(loadedProject.title)} — David Laßlberger`;
                document.getElementById('proj-title').textContent = getLang(loadedProject.title);
                document.getElementById('proj-hero').alt = getLang(loadedProject.title);
                document.getElementById('proj-category').textContent = getLang(loadedProject.category);
                document.getElementById('proj-role').textContent = getLang(loadedProject.role);
                document.getElementById('proj-tools').textContent = getLang(loadedProject.tools);
                document.getElementById('proj-content').innerHTML =
                    (loadedProject.sections || []).map((block, i) => renderBlock(block, i === 0)).join('');
                initScrollReveal();
            }
            if (loadedPrev && loadedNext) {
                document.getElementById('prev-title').textContent = getLang(loadedPrev.title);
                document.getElementById('prev-category').textContent = getLang(loadedPrev.category);
                document.getElementById('next-title').textContent = getLang(loadedNext.title);
                document.getElementById('next-category').textContent = getLang(loadedNext.category);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('lang', currentLang);
            applyLanguage();
        }

        applyLanguage();

        // Navbar scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('bg-white/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.remove('bg-white/0');
            } else {
                navbar.classList.remove('bg-white/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.add('bg-white/0');
            }
        }, { passive: true });

        // Mobile menu
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const iconOpen = document.getElementById('menuIconOpen');
            const iconClose = document.getElementById('menuIconClose');
            const isHidden = menu.classList.contains('opacity-0');
            if (isHidden) {
                menu.classList.remove('opacity-0', 'pointer-events-none');
                menu.classList.add('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
                if (iconOpen) iconOpen.classList.add('hidden');
                if (iconClose) iconClose.classList.remove('hidden');
            } else {
                menu.classList.add('opacity-0', 'pointer-events-none');
                menu.classList.remove('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = '';
                if (iconOpen) iconOpen.classList.remove('hidden');
                if (iconClose) iconClose.classList.add('hidden');
            }
        }

        // Custom Cursor & Interaction Logic
        const cursor = document.getElementById('custom-cursor');
        if (ENABLE_CUSTOM_CURSOR && cursor) {
            document.body.classList.add('custom-cursor-enabled');

            let mouseX = -100, mouseY = -100;
            let dotX = -100, dotY = -100;
            const LERP = 0.07;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            (function animateDot() {
                dotX += (mouseX - dotX) * LERP;
                dotY += (mouseY - dotY) * LERP;
                cursor.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;
                requestAnimationFrame(animateDot);
            })();

            document.querySelectorAll('.hover-target').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        } else if (cursor) {
            cursor.style.display = 'none';
        }

        // Scroll reveal — called after sections are injected
        function initScrollReveal() {
            const observer = new IntersectionObserver(
                entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); }),
                { threshold: 0.08 }
            );
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        // Fade-in with translate — used for header fields after content is set
        function animateIn(el, delay) {
            if (!el) return;
            requestAnimationFrame(() => {
                el.style.transition = `opacity 0.8s ${delay}s cubic-bezier(0.5,0,0,1), transform 0.8s ${delay}s cubic-bezier(0.5,0,0,1)`;
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });
        }

        // ── Section renderers ──────────────────────────────────────────────

        function renderSection(block, isFirst) {
            const topPad = isFirst ? 'pt-20' : 'pt-16';
            const heading = getLang(block.heading);
            const bodyArr = Array.isArray(block.body) ? block.body : (block.body ? (block.body[currentLang] || block.body.en || []) : []);
            const paragraphs = bodyArr
                .map(p => `<p class="text-gray-600 leading-relaxed mb-4">${p}</p>`)
                .join('');
            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 ${topPad} pb-16">
                    <div class="reveal-on-scroll flex items-center gap-5 mb-10">
                        <span class="text-xs text-gray-400 uppercase tracking-[0.25em] font-mono shrink-0">${block.number}</span>
                        <div class="flex-1 h-px bg-gray-200"></div>
                    </div>
                    <div class="grid grid-cols-12 gap-x-8">
                        <div class="col-span-12 md:col-span-4 reveal-on-scroll">
                            <h2 class="font-bold text-2xl tracking-tight mb-4">${heading}</h2>
                        </div>
                        <div class="col-span-12 md:col-span-7 md:col-start-6 reveal-on-scroll">
                            ${paragraphs}
                        </div>
                    </div>
                </section>`;
        }

        function renderImages2col(block) {
            const imgFit = block.fit === 'contain' ? 'object-contain' : 'object-cover';
            const imgSizing = block.fit === 'auto' ? 'h-auto' : `${imgFit} aspect-[4/3]`;
            const shadow = shadowClass(block);
            const mobileGap = block.mobileGap ? 'pb-6 md:pb-0' : '';
            const imgs = (block.images || [])
                .map(src => `<div class="col-span-12 md:col-span-6 ${mobileGap}"><img src="${src}" alt="" class="w-full ${imgSizing} ${shadow}"></div>`)
                .join('');
            const captionText = getLang(block.caption);
            const caption = captionText
                ? `<div class="grid grid-cols-12 mt-5"><p class="col-span-12 md:col-span-8 text-sm text-gray-400 leading-relaxed">${captionText}</p></div>`
                : '';
            const styleParts = [];
            if (block.maxWidth) styleParts.push(`max-width:${block.maxWidth};margin-left:auto;margin-right:auto`);
            if (block.gap) styleParts.push(`gap:${block.gap}`);
            const wrapStyle = styleParts.length ? ` style="${styleParts.join(';')}"` : '';
            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 pb-16">
                    <div class="grid grid-cols-12 gap-3 reveal-on-scroll mb-5"${wrapStyle}>${imgs}</div>
                    ${caption}
                </section>`;
        }

        function renderImages3col(block) {
            const imgFit = block.fit === 'contain' ? 'object-contain' : 'object-cover';
            const imgSizing = block.fit === 'auto' ? 'h-auto' : `${imgFit} aspect-square`;
            const shadow = shadowClass(block);
            const imgs = (block.images || [])
                .map((src, i) => `<div class="${i === 2 ? 'col-span-12' : 'col-span-6'} md:col-span-4"><img src="${src}" alt="" class="w-full ${imgSizing} ${shadow}"></div>`)
                .join('');
            const captionText = getLang(block.caption);
            const caption = captionText
                ? `<div class="grid grid-cols-12 mt-5"><p class="col-span-12 md:col-span-8 text-sm text-gray-400 leading-relaxed">${captionText}</p></div>`
                : '';
            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 pb-16">
                    <div class="grid grid-cols-12 gap-3 reveal-on-scroll">${imgs}</div>
                    ${caption}
                </section>`;
        }

        function renderImageWide(block) {
            const captionText = getLang(block.caption);
            const caption = captionText
                ? `<div class="grid grid-cols-12 mt-4 mb-4"><p class="col-span-12 md:col-span-8 text-sm text-gray-400 leading-relaxed">${captionText}</p></div>`
                : '';
            const shadow = shadowClass(block);
            if (block.bg) {
                return `
                <section style="background-color:${block.bg}" class="reveal-on-scroll py-6">
                    <div class="max-w-7xl mx-auto px-6 lg:px-8">
                        <img src="${block.src}" alt="${block.alt || ''}" class="w-full object-cover ${shadow}">
                        ${caption}
                    </div>
                </section>`;
            }
            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 pb-4">
                    <div class="reveal-on-scroll mb-3">
                        <img src="${block.src}" alt="${block.alt || ''}" class="w-full object-cover ${shadow}">
                    </div>
                    ${caption}
                </section>`;
        }

        function renderImageHighlight(block) {
            const captionText = getLang(block.caption);
            const caption = captionText
                ? `<p class="text-sm text-gray-400 mt-4 leading-relaxed">${captionText}</p>`
                : '';
            const shadow = shadowClass(block);
            return `
                <section class="bg-gray-50 py-16 reveal-on-scroll">
                    <div class="max-w-7xl mx-auto px-6 lg:px-8">
                        <img src="${block.src}" alt="${block.alt || ''}" class="w-full object-cover ${shadow}">
                        ${caption}
                    </div>
                </section>`;
        }

        // Image + text pair. block.layout: "contained" (default, image stays in
        // its own half) or "bleed" (image spans past the center into the text's
        // half). block.side: "left" (default) or "right" picks which half the
        // image sits in.
        function renderImageText(block, isFirst) {
            const topPad = isFirst ? 'pt-20' : (block.number ? 'pt-16' : '');
            const label = getLang(block.label);
            const heading = getLang(block.heading);
            const bodyArr = Array.isArray(block.body) ? block.body : (block.body ? (block.body[currentLang] || block.body.en || []) : []);
            const paragraphs = bodyArr.map(p => `<p class="text-gray-600 leading-relaxed mb-4">${p}</p>`).join('');

            const bleed = block.layout === 'bleed';
            const imageRight = block.side === 'right';
            const imgFit = block.fit === 'contain' ? 'object-contain' : 'object-cover';
            const imgSizing = block.fit === 'auto' ? 'h-auto' : `${imgFit} aspect-[4/3]`;
            const shadow = shadowClass(block);

            const imgClasses = bleed
                ? (imageRight ? 'md:col-span-7 md:col-start-6 order-1 md:order-2' : 'md:col-span-7')
                : (imageRight ? 'md:col-span-6 order-1 md:order-2' : 'md:col-span-6');
            const textClasses = bleed
                ? (imageRight ? 'md:col-span-4 order-2 md:order-1' : 'md:col-span-4 md:col-start-9')
                : (imageRight ? 'md:col-span-6 order-2 md:order-1' : 'md:col-span-6');

            const numberDivider = block.number ? `
                <div class="reveal-on-scroll flex items-center gap-5 mb-10">
                    <span class="text-xs text-gray-400 uppercase tracking-[0.25em] font-mono shrink-0">${block.number}</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>` : '';

            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 ${topPad} pb-16">
                    ${numberDivider}
                    <div class="grid grid-cols-12 gap-x-8 gap-y-8 items-center">
                        <div class="col-span-12 ${imgClasses} reveal-on-scroll">
                            <img src="${block.image}" alt="${block.alt || ''}" class="w-full ${imgSizing} ${shadow}">
                        </div>
                        <div class="col-span-12 ${textClasses} reveal-on-scroll">
                            ${label ? `<span class="block text-xs text-gray-400 uppercase tracking-widest font-mono mb-3">${label}</span>` : ''}
                            ${heading ? `<h3 class="text-xl md:text-2xl font-semibold mb-3">${heading}</h3>` : ''}
                            ${paragraphs}
                        </div>
                    </div>
                </section>`;
        }

        // Single image centered on the page axis, with an optional caption
        // centered directly beneath it.
        function renderImageCentered(block) {
            const label = getLang(block.label);
            const heading = getLang(block.heading);
            const bodyArr = Array.isArray(block.body) ? block.body : (block.body ? (block.body[currentLang] || block.body.en || []) : []);
            const paragraphs = bodyArr.map(p => `<p class="text-gray-600 leading-relaxed mb-4">${p}</p>`).join('');
            const hasCaption = Boolean(label || heading || paragraphs);
            const imgFit = block.fit === 'contain' ? 'object-contain' : 'object-cover';
            const shadow = shadowClass(block);
            const imageMarkup = block.fit === 'auto'
                ? `<img src="${block.image}" alt="${block.alt || ''}" class="w-full h-auto ${shadow} ${hasCaption ? 'mb-8' : ''}">`
                : `<div class="aspect-[16/9] bg-gray-100 overflow-hidden ${hasCaption ? 'mb-8' : ''}">
                            <img src="${block.image}" alt="${block.alt || ''}" class="w-full h-full ${imgFit} ${shadow}">
                        </div>`;

            return `
                <section class="max-w-7xl mx-auto px-6 lg:px-8 pb-16">
                    <div class="max-w-3xl mx-auto reveal-on-scroll">
                        ${imageMarkup}
                        ${hasCaption ? `
                        <div class="text-center max-w-xl mx-auto">
                            ${label ? `<span class="block text-xs text-gray-400 uppercase tracking-widest font-mono mb-3">${label}</span>` : ''}
                            ${heading ? `<h3 class="text-xl md:text-2xl font-semibold mb-3">${heading}</h3>` : ''}
                            ${paragraphs}
                        </div>` : ''}
                    </div>
                </section>`;
        }

        // Large centered statement, no image — bounded by rules above and below.
        function renderStatement(block) {
            const label = getLang(block.label);
            const text = getLang(block.text);
            return `
                <section class="reveal-on-scroll">
                    <div class="max-w-7xl mx-auto px-6 lg:px-8">
                        <div class="${block.noRules ? '' : 'border-t border-b border-gray-200'} py-20 md:py-28 text-center">
                            ${label ? `<span class="block text-xs uppercase tracking-widest text-gray-400 font-mono mb-6">${label}</span>` : ''}
                            <h2 class="text-3xl md:text-5xl lg:text-6xl font-bold tracking-tight max-w-4xl mx-auto leading-tight">${text}</h2>
                        </div>
                    </div>
                </section>`;
        }

        function renderBlock(block, isFirst) {
            switch (block.type) {
                case 'section': return renderSection(block, isFirst);
                case 'images-2col': return renderImages2col(block);
                case 'images-3col': return renderImages3col(block);
                case 'image-wide': return renderImageWide(block);
                case 'image-highlight': return renderImageHighlight(block);
                case 'image-text': return renderImageText(block, isFirst);
                case 'image-centered': return renderImageCentered(block);
                case 'statement': return renderStatement(block);
                default: return '';
            }
        }

        // ── Project loader ─────────────────────────────────────────────────

        async function loadProject() {
            const id = new URLSearchParams(window.location.search).get('id');

            if (!id) {
                document.getElementById('proj-content').innerHTML =
                    '<div class="max-w-7xl mx-auto px-6 lg:px-8 py-32 text-center"><p class="text-gray-400 font-mono text-sm">No project specified.</p></div>';
                return;
            }

            let data;
            try {
                const res = await fetch('projects.json');
                data = await res.json();
            } catch (e) {
                document.getElementById('proj-content').innerHTML =
                    '<div class="max-w-7xl mx-auto px-6 lg:px-8 py-32 text-center"><p class="text-gray-400 font-mono text-sm">Could not load project data.</p></div>';
                return;
            }

            const projects = data.projects;
            const index = projects.findIndex(p => p.id === id);

            if (index === -1) {
                document.getElementById('proj-content').innerHTML =
                    '<div class="max-w-7xl mx-auto px-6 lg:px-8 py-32 text-center"><p class="text-gray-400 font-mono text-sm">Project not found.</p></div>';
                return;
            }

            const project = projects[index];
            loadedProject = project;
            // Wrap-around prev/next
            loadedPrev = projects[(index - 1 + projects.length) % projects.length];
            loadedNext = projects[(index + 1) % projects.length];
            const prev = loadedPrev;
            const next = loadedNext;

            // Page title
            document.title = `${getLang(project.title)} — David Laßlberger`;

            // Header fields
            document.getElementById('proj-title').textContent = getLang(project.title);
            document.getElementById('proj-year').textContent = project.year;
            document.getElementById('proj-category').textContent = getLang(project.category);
            document.getElementById('proj-role').textContent = getLang(project.role);
            document.getElementById('proj-tools').textContent = getLang(project.tools);

            const hero = document.getElementById('proj-hero');
            hero.src = project.hero;
            hero.alt = getLang(project.title);

            // Render content sections
            document.getElementById('proj-content').innerHTML =
                (project.sections || []).map((block, i) => renderBlock(block, i === 0)).join('');

            // Prev / Next footer
            if (projects.length > 1) {
                const thumbOf = (p) => (p.thumb || (p.hero || '').replace(/_h(\.\w+)$/, '_t$1'));
                document.getElementById('prev-link').href = `project.html?id=${prev.id}`;
                document.getElementById('prev-title').textContent = getLang(prev.title);
                document.getElementById('prev-category').textContent = getLang(prev.category);
                document.getElementById('prev-image').src = thumbOf(prev);
                document.getElementById('prev-image').alt = getLang(prev.title);
                document.getElementById('next-link').href = `project.html?id=${next.id}`;
                document.getElementById('next-title').textContent = getLang(next.title);
                document.getElementById('next-category').textContent = getLang(next.category);
                document.getElementById('next-image').src = thumbOf(next);
                document.getElementById('next-image').alt = getLang(next.title);
                document.getElementById('proj-nav').classList.remove('hidden');
            }

            // Animate header in (content is already set, so elements won't flash empty)
            animateIn(document.getElementById('proj-title'), 0.05);
            animateIn(document.getElementById('hdr-hero'), 0.32);
            animateIn(document.getElementById('hdr-meta'), 0.44);

            // Wire up scroll reveal for injected sections
            initScrollReveal();
        }

        loadProject();
    </script>

</body>
